<svg xmlns="http://www.w3.org/2000/svg" width="470" height="317" viewBox="70 -776 470 317" role="img" aria-labelledby="title"><title id="title">Locations of sources across both peaks as a percentage of total citations.</title><defs></defs><g transform="scale(1,-1)"><path d="M 0 842.38 L 596 842.38 L 596 -0.61938 L 0 -0.61938 Z" transform="matrix(1 0 0 1 0 0)" fill="rgb(255,255,255)" fill-opacity="1" stroke-opacity="1" stroke="none" stroke-width="1" stroke-dasharray="none" fill-rule="nonzero"/><text transform="matrix(10 0 -0 -10 56.693 796.56)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="italic" fill="rgb(0,0,0)">607 Journalists</text><text transform="matrix(10 0 -0 -10 450.84 796.56)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="italic" fill="rgb(0,0,0)">J.R.B. Sutherland</text><text transform="matrix(12 0 -0 -12 56.693 409.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">citations, however, see an increase of 1.62 percentage points into peak 2, </text><text transform="matrix(12 0 -0 -12 56.693 387.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">while online sources without an obvious origin, as well as foreign sources, see </text><text transform="matrix(12 0 -0 -12 56.693 364.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">a marked decrease. </text><text transform="matrix(12 0 -0 -12 56.693 319.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="bold" font-style="normal" fill="rgb(0,0,0)">Publishers of sources </text><text transform="matrix(12 0 -0 -12 56.693 297.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">In the first peak, there were 72 unique publishers used at least once across the </text><text transform="matrix(12 0 -0 -12 56.693 274.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">ten samples; in the second this figure increases to 87. Both peaks are </text><text transform="matrix(12 0 -0 -12 56.693 252.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">dominated, however, by a select few of the most-used references. On average, </text><text transform="matrix(12 0 -0 -12 56.693 229.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">the top ten references in peak 1 accounted for 55.9 percent of the total </text><text transform="matrix(12 0 -0 -12 56.693 207.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">citations, and in peak 2 this figure rose to 61.3 percent</text><text transform="matrix(12 0 -0 -12 410.24 207.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">, suggesting a move </text><text transform="matrix(12 0 -0 -12 56.693 184.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">towards the centralisation of publishers between the two peaks. Both sets of </text><text transform="matrix(12 0 -0 -12 56.693 162.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">twenty most-used publishers can be observed in Table 3. </text><text transform="matrix(12 0 -0 -12 56.693 117.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">These sources are primarily high-profile news sources which cover the whole of </text><text transform="matrix(12 0 -0 -12 56.693 94.717)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">the United States, such as Georgia-based broadcaster CNN and national </text><text transform="matrix(12 0 -0 -12 56.693 72.217)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">newspapers the </text><text transform="matrix(12 0 -0 -12 157.17 72.217)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="italic" fill="rgb(0,0,0)">Washington Post</text><text transform="matrix(12 0 -0 -12 258.31 72.217)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)"> and the </text><text transform="matrix(12 0 -0 -12 314.32 72.217)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="italic" fill="rgb(0,0,0)">New York Times</text><text transform="matrix(12 0 -0 -12 412.37 72.217)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">. The Missouri-based </text><text transform="matrix(12 0 -0 -12 290.01 45.039)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">!</text><text transform="matrix(12 0 -0 -12 290.01 45.039)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">36</text><path d="M 177.04 12.197 L 177.04 289.2" transform="matrix(1 0 0 -1 87.463 785.2)" fill="none" fill-opacity="1" stroke-opacity="1" stroke="rgb(184,184,184)" stroke-width="0.5" stroke-dasharray="none" fill-rule="nonzero"/><path d="M 242.04 12.197 L 242.04 289.2" transform="matrix(1 0 0 -1 87.463 785.2)" fill="none" fill-opacity="1" stroke-opacity="1" stroke="rgb(184,184,184)" stroke-width="0.5" stroke-dasharray="none" fill-rule="nonzero"/><path d="M 307.04 12.197 L 307.04 289.2" transform="matrix(1 0 0 -1 87.463 785.2)" fill="none" fill-opacity="1" stroke-opacity="1" stroke="rgb(184,184,184)" stroke-width="0.5" stroke-dasharray="none" fill-rule="nonzero"/><path d="M 372.04 12.197 L 372.04 289.2" transform="matri