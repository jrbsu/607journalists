<svg xmlns="http://www.w3.org/2000/svg" width="484" height="252" viewBox="56 -554 484 252" role="img" aria-labelledby="title"><title id="title">Content added to each peak per sample, expressed as a percentage of the final figure for each peak.</title><defs></defs><g transform="scale(1,-1)"><path d="M 0 842.71 L 596 842.71 L 596 -0.28943 L 0 -0.28943 Z" transform="matrix(1 0 0 1 0 0)" fill="rgb(255,255,255)" fill-opacity="1" stroke-opacity="1" stroke="none" stroke-width="1" stroke-dasharray="none" fill-rule="nonzero"/><text transform="matrix(10 0 -0 -10 56.693 796.56)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="italic" fill="rgb(0,0,0)">607 Journalists</text><text transform="matrix(10 0 -0 -10 450.84 796.56)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="italic" fill="rgb(0,0,0)">J.R.B. Sutherland</text><text transform="matrix(12 0 -0 -12 56.693 772.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="bold" font-style="normal" fill="rgb(0,0,0)">Text added </text><text transform="matrix(12 0 -0 -12 56.693 750.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">Across both peaks, a large amount of text was added to the article. In the first </text><text transform="matrix(12 0 -0 -12 56.693 727.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">peak, this amounted to 30,905 bytes of data, meaning an average addition of </text><text transform="matrix(12 0 -0 -12 56.693 705.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">61.81 bytes per edit, and a mean of 501.02 bytes added per hour. The second </text><text transform="matrix(12 0 -0 -12 56.693 682.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">peak, which lasted much longer chronologically, saw 39,179 bytes of text </text><text transform="matrix(12 0 -0 -12 56.693 660.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">added over the observed period of editing, signifying a mean of 78.36 bytes </text><text transform="matrix(12 0 -0 -12 56.693 637.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">added per edit, but only 138.77 bytes added per hour. This means that text </text><text transform="matrix(12 0 -0 -12 56.693 615.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">addition was on average 3.6 times slower than in the first peak. A significant </text><text transform="matrix(12 0 -0 -12 56.693 592.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">correlation between these rates of development can be identified using Pearson </text><text transform="matrix(12 0 -0 -12 56.693 570.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">correlation, at the 0.01 level. This is visualised using percentages in Figure 12.</text><text transform="matrix(12 0 -0 -12 56.693 172.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="bold" font-style="normal" fill="rgb(0,0,0)">4.3 ANALYSIS OF SOURCES </text><text transform="matrix(12 0 -0 -12 56.693 138.22)" font-family="Arial, sans-serif" font-size="1.0" font-weight="bold" font-style="normal" fill="rgb(0,0,0)">4.3.1 USAGE OF SOURCES </text><text transform="matrix(12 0 -0 -12 56.693 103.72)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">For this analysis, the use of references was quantified over ten systematic </text><text transform="matrix(12 0 -0 -12 56.693 81.217)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">samples taken from each peak, with the objective being to compare and </text><text transform="matrix(12 0 -0 -12 290.01 45.039)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">!</text><text transform="matrix(12 0 -0 -12 290.01 45.039)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">33</text><path d="M 51.145 167.93 L 460.14 167.93" transform="matrix(1 0 0 -1 63.855 555.43)" fill="none" fill-opacity="1" stroke-opacity="1" stroke="rgb(184,184,184)" stroke-width="0.25" stroke-dasharray="none" fill-rule="nonzero"/><path d="M 51.145 114.93 L 460.14 114.93" transform="matrix(1 0 0 -1 63.855 555.43)" fill="none" fill-opacity="1" stroke-opacity="1" stroke="rgb(184,184,184)" stroke-width="0.25" stroke-dasharray="none" fill-rule="nonzero"/><path d="M 51.145 62.928 L 460.14 62.928" transform="matrix(1 0 0 -1 63.855 555.43)" fill="none" fill-opacity="1" stroke-opacity="1" stroke="rgb(184,184,184)" stroke-width="0.25" stroke-dasharray="none" fill-rule="nonzero"/><path d="M 51.145 9.9285 L 460.14 9.9285" transform="matrix(1 0 0 -1 63.855 555.43)" fill="none" fill-opacity="1" stroke-opacity="1" stroke="rgb(184,184,184)" stroke-width="0.25" stroke-dasharray="none" fill-rule="nonzero"/><text transform="matrix(0 8.91 8.91 -0 72.985 352.62)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">Percentage of text content during peak</text><text transform="matrix(8.1 0 -0 -8.1 85.505 331.67)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">60%</text><text transform="matrix(8.1 0 -0 -8.1 85.505 384.28)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">70%</text><text transform="matrix(8.1 0 -0 -8.1 85.505 436.9)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">80%</text><text transform="matrix(8.1 0 -0 -8.1 85.505 489.51)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">90%</text><text transform="matrix(8.1 0 -0 -8.1 80.355 542.13)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">100%</text><path d="M 50.645 220.93 L 460.64 220.93" transform="matrix(1 0 0 -1 63.855 555.43)" fill="none" fill-opacity="1" stroke-opacity="1" stroke="rgb(0,0,0)" stroke-width="1" stroke-dasharray="none" fill-rule="nonzero"/><text transform="matrix(8.91 0 -0 -8.91 283.97 307.41)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">Sample number</text><text transform="matrix(8.1 0 -0 -8.1 112.37 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">1</text><text transform="matrix(8.1 0 -0 -8.1 129.07 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">3</text><text transform="matrix(8.1 0 -0 -8.1 145.77 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">5</text><text transform="matrix(8.1 0 -0 -8.1 162.47 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">7</text><text transform="matrix(8.1 0 -0 -8.1 179.18 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">9</text><text transform="matrix(8.1 0 -0 -8.1 193.3 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">11</text><text transform="matrix(8.1 0 -0 -8.1 210.01 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">13</text><text transform="matrix(8.1 0 -0 -8.1 226.71 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">15</text><text transform="matrix(8.1 0 -0 -8.1 243.41 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">17</text><text transform="matrix(8.1 0 -0 -8.1 260.11 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">19</text><text transform="matrix(8.1 0 -0 -8.1 276.81 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">21</text><text transform="matrix(8.1 0 -0 -8.1 293.51 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">23</text><text transform="matrix(8.1 0 -0 -8.1 310.22 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">25</text><text transform="matrix(8.1 0 -0 -8.1 326.92 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">27</text><text transform="matrix(8.1 0 -0 -8.1 343.62 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">29</text><text transform="matrix(8.1 0 -0 -8.1 360.32 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">31</text><text transform="matrix(8.1 0 -0 -8.1 377.02 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">33</text><text transform="matrix(8.1 0 -0 -8.1 393.73 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">35</text><text transform="matrix(8.1 0 -0 -8.1 410.43 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">37</text><text transform="matrix(8.1 0 -0 -8.1 427.13 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">39</text><text transform="matrix(8.1 0 -0 -8.1 443.83 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">41</text><text transform="matrix(8.1 0 -0 -8.1 460.53 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">43</text><text transform="matrix(8.1 0 -0 -8.1 477.24 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">45</text><text transform="matrix(8.1 0 -0 -8.1 493.94 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">47</text><text transform="matrix(8.1 0 -0 -8.1 510.64 323.24)" font-family="Arial, sans-serif" font-size="1.0" font-weight="normal" font-style="normal" fill="rgb(0,0,0)">49</text><path d="M 0 86.269 L 8.351 83.993 L 16.702 84.532 L 25.053 84.437 L 33.404 82.431 L 41.755 81.901 L 50.106 81.234 L 58.457 78.169 L 66.808 78.074 L 75.159 78.147 L 83.51 75.418 L 91.861 72.855 L 100.21 70.383 L 108.56 69.722 L 116.91 69.165 L 125.26 66.884 L 133.62 67.232 L 141.97 67.19 L 150.32 56.103 L 158.67 52.932 L 167.02 52.976 L 175.37 49.565 L 183.72 46.483 L 192.07 46.593 L 200.42 52.626 L 208.77 51.347 L 217.13 47.308 L 225.48 44.376 L 233.83 22.898 L 242.18 21.279 L 250.53 36.874 L 258.88 35.836 L 267.23 34.029 L 275.58 31.369 L 283.93 29.31 L 292.28 30.321 L 300.64 30.323 L 308.99 30.195 L 317.34 30.288 L 325.69 30.008 L 334.04 29.528 L 342.39 29.841 L 350.74 27.513 L 359.09 21.042 L 367.44 21.092 L 375.79 21.828 L 384.15 18.688 L 392.5 16.314 L 400.85 10.95 L 409.2 0" transform="matrix(1 0 0 -1 114.94 545.43)" fill="none" fill-opacity="1" stroke-opacity="0.7" stroke="rgb(0,184,255)" stroke-width="4.0" stroke-dasharray="none" fill-r